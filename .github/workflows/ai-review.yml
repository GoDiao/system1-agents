name: AI PR Review

# pull_request_target, so that pull requests from forks (the usual way in here) get the token this job needs.
# Nothing from the pull request is checked out or run: the job reads the diff through the API, the prompt comes
# from the base branch, and the model's answer reaches the comment as a file, never as part of a script.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  AI_REVIEW_MODEL: gpt-4.1
  AI_REVIEW_MAX_TOKENS: "3000"
  AI_REVIEW_MAX_DIFF_BYTES: "40000"

jobs:
  review:
    if: |
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@ai-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/prompts
          persist-credentials: false

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr diff "$PR_NUMBER" > "$RUNNER_TEMP/pr.diff"

          DIFF_SIZE=$(wc -c < "$RUNNER_TEMP/pr.diff")
          if [ "$DIFF_SIZE" -gt "$AI_REVIEW_MAX_DIFF_BYTES" ]; then
            head -c "$AI_REVIEW_MAX_DIFF_BYTES" "$RUNNER_TEMP/pr.diff" > "$RUNNER_TEMP/pr_cut.diff"
            printf '\n> Diff cut to %s of %s bytes; the rest was not reviewed.\n' \
              "$AI_REVIEW_MAX_DIFF_BYTES" "$DIFF_SIZE" >> "$RUNNER_TEMP/pr_cut.diff"
            mv "$RUNNER_TEMP/pr_cut.diff" "$RUNNER_TEMP/pr.diff"
          fi

          {
            echo "diff_size=$DIFF_SIZE"
            echo "diff_file=$RUNNER_TEMP/pr.diff"
          } >> "$GITHUB_OUTPUT"

      - name: Run AI inference
        id: inference
        if: steps.diff.outputs.diff_size != '0'
        uses: actions/ai-inference@v1
        with:
          prompt-file: ./.github/prompts/review-pr.prompt.yml
          file_input: |
            diff: ${{ steps.diff.outputs.diff_file }}
          model: ${{ env.AI_REVIEW_MODEL }}
          max-tokens: ${{ env.AI_REVIEW_MAX_TOKENS }}

      - name: Post or update the review comment
        if: steps.inference.outputs.response-file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
          DIFF_SIZE: ${{ steps.diff.outputs.diff_size }}
        run: |
          MARKER='<!-- ai-review -->'
          {
            echo "$MARKER"
            echo '## AI Review'
            echo
            echo '> Automated first pass from the `review-pr` skill. A maintainer verifies every finding.'
            echo
            cat "$RESPONSE_FILE"
            echo
            echo '---'
            echo "*Diff size: ${DIFF_SIZE} bytes. Model: ${AI_REVIEW_MODEL} via GitHub Models.*"
          } > "$RUNNER_TEMP/review_body.md"

          COMMENT_ID=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ai-review -->"))) | .id' \
            | tail -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/review_body.md"
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/review_body.md"
          fi
