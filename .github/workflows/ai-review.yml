name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@ai-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          gh pr diff $PR_NUMBER > /tmp/pr.diff

          DIFF_SIZE=$(wc -c < /tmp/pr.diff)
          if [ "$DIFF_SIZE" -gt 40000 ]; then
            head -c 40000 /tmp/pr.diff > /tmp/pr_truncated.diff
            echo "" >> /tmp/pr_truncated.diff
            echo "> ⚠️ Diff truncated to 40K characters (original: ${DIFF_SIZE} bytes). Review may be incomplete." >> /tmp/pr_truncated.diff
            mv /tmp/pr_truncated.diff /tmp/pr.diff
          fi

          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt-file: ./.github/prompts/review-pr.prompt.yml
          file_input: |
            diff: /tmp/pr.diff
          model: gpt-4.1
          max-tokens: 1500

      - name: Post review comment
        if: steps.inference.outputs.response != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.diff.outputs.pr_number }}
        run: |
          cat > /tmp/review_body.md << 'EOF'
          ## 🤖 AI Review

          > Generated by `review-pr` skill. This is an automated first-pass review — a human maintainer should verify all findings.

          ${{ steps.inference.outputs.response }}

          ---
          *Diff size: ${{ steps.diff.outputs.diff_size }} bytes. Model: gpt-4.1 via GitHub Models (free tier).*
          EOF

          gh pr comment $PR_NUMBER --body-file /tmp/review_body.md
