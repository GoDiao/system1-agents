name: AI PR Review

# pull_request_target, so that pull requests from forks (the usual way in here) get the secret this job needs.
# Nothing from the pull request is checked out or run: scripts/ai_review.py and the skill come from the base branch,
# the diff and the PR text are read through the API, and the model's answer is posted as data.
# Setup: the secret AI_REVIEW_API_KEY turns it on; the variables AI_REVIEW_BASE_URL (any OpenAI-compatible endpoint)
# and AI_REVIEW_MODEL pick the model. Without the secret the job does nothing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # At job level, so that the many issue_comment runs this job skips never take the group and cancel a review.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    if: |
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@ai-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ai_review.py
            .claude/skills/review-pr
          persist-credentials: false

      - name: Review the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ vars.AI_REVIEW_BASE_URL }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_EXTRA_BODY: ${{ vars.AI_REVIEW_EXTRA_BODY }}
        run: python3 scripts/ai_review.py
