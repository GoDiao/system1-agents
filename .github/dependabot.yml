version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # ai2thor 2.1.0 is the Unity build the ALFWorld games were generated in; werkzeug 2.0.3 is alfworld's pin for its server.
      - dependency-name: ai2thor
      - dependency-name: werkzeug
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
